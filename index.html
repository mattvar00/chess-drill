<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f1d1a">
<title>Drill · matt_chess00</title>
<link rel="stylesheet" href="css/app.css?v=14">
</head>
<body>
<div class="top">
  <button class="back hidden" id="back" aria-label="Retour">‹</button>
  <div class="htitle" id="htitle">Aujourd'hui</div>
  <button class="gear" id="gear" aria-label="Réglages">⚙</button>
</div>
<div class="wrap">
  <div id="home"></div>
  <div id="drill" class="grid hidden">
    <div>
      <div class="turnbar"><div class="who" id="topname"><i></i><span>Adversaire</span></div><div id="branchtag" class="tag"></div></div>
      <div class="board" id="board"></div>
      <div class="turnbar"><div class="who" id="botname"><i></i><span>Toi</span></div><div id="sidenote"></div></div>
    </div>
    <div class="panel">
      <div class="ph"><div class="tt" id="ptitle"></div><span class="tag" id="ptag"></span></div>
      <div class="modes" id="modes"></div>
      <div class="stepper" id="stepper"></div>
      <div class="coach" id="coach"></div>
      <div class="explnav hidden" id="explnav"><button id="eFirst">⏮</button><button id="ePrev">‹</button><button id="eNext">›</button><button id="eLast">⏭</button></div>
      <div class="actions" id="actions"></div>
      <div class="moves" id="moves"></div>
      <div class="meta" id="meta"></div>
    </div>
  </div>
</div>
<nav class="bottom">
  <button id="nav-today"><i>☀</i><span>Aujourd'hui</span></button>
  <button id="nav-train"><i>♞</i><span>Entraîner</span></button>
  <button id="nav-games"><i>⇅</i><span>Parties</span></button>
  <button id="nav-prof"><i>↗</i><span>Progrès</span></button>
</nav>
<div id="sheet" class="sheet hidden"><div class="sheetbox"><div class="sheettitle" id="sheettitle"></div><div id="sheetbody"></div><button id="sheetclose" class="sec">Fermer</button></div></div>
<script src="js/chess.js?v=14"></script>
<script src="js/pieces.js?v=14"></script>
<script src="js/data.js?v=14"></script>
<script src="js/store.js?v=14"></script>
<script src="js/engine.js?v=14"></script>
<script src="js/games.js?v=14"></script>
<script src="js/update.js?v=14"></script>
<script src="js/maia/moves.js?v=14"></script>
<script src="js/maia.js?v=14"></script>
<script src="js/profile.js?v=14"></script>
<script src="js/style.js?v=14"></script>
<script src="js/plans-data.js?v=14"></script>
<script src="js/plans.js?v=14"></script>
<script src="js/nav.js?v=14"></script>
<script src="js/app.js?v=14"></script>
<script src="js/board2.js?v=14"></script>
<script src="js/sync.js?v=14"></script>
</body>
</html>
