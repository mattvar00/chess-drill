# Analyse des parties chess.com avec Stockfish natif, chaque nuit ou à la demande (bouton « analyser maintenant » de l'app).
# Secret du repo : APP_TOKEN (le même que le Worker). API_URL : variable du repo, sinon l'adresse du Worker ci-dessous.
# Variable du repo (optionnelle) : USERS, pseudos séparés par des virgules (défaut : matt_chess00).
name: Analyse
on:
  schedule:
    - cron: '17 3 * * *'   # 3h17 UTC
  # quand la façon d'analyser change, toutes les parties récentes sont réanalysées avec la nouvelle version
  push:
    branches: [main]
    paths: ['app/src/core/analysis.ts', 'app/src/core/phase.ts', 'app/scripts/analyse.ts', 'app/scripts/uci.ts', '.github/workflows/analyse.yml']
  workflow_dispatch:
    inputs:
      users: { description: 'Pseudos chess.com (virgules)', required: false, default: '' }
      days: { description: "Fenêtre d'import en jours (toutes les parties, sans moteur)", required: false, default: '3' }
      analyse_days: { description: "Fenêtre de l'analyse au moteur en jours (vide = comme l'import)", required: false, default: '' }
      max: { description: 'Nombre maximal de parties analysées au moteur', required: false, default: '200' }
      redo: { description: 'Réanalyser aussi les parties déjà analysées', type: boolean, required: false, default: false }
permissions: { contents: write }
concurrency: { group: analyse, cancel-in-progress: false }
jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
      - name: Stockfish
        run: sudo apt-get update -qq && sudo apt-get install -y -qq stockfish && echo quit | /usr/games/stockfish | head -1
      - name: Analyse
        env:
          STOCKFISH: /usr/games/stockfish
          API_URL: ${{ vars.API_URL || 'https://chess-drill.mattvar36.workers.dev' }}
          API_TOKEN: ${{ secrets.APP_TOKEN }}
          USERS: ${{ inputs.users || vars.USERS || 'matt_chess00' }}
        # en cas d'échec, la fin du journal devient une annotation : elle se lit sans être connecté à GitHub
        run: |
          set -o pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            ARGS="--days 90 --analyse-days 90 --max 1000 --depth 16 --redo"
          else
            ARGS="--days ${{ inputs.days || '3' }} --analyse-days ${{ inputs.analyse_days || inputs.days || '3' }} --max ${{ inputs.max || '200' }} --depth 16 ${{ inputs.redo && '--redo' || '' }}"
          fi
          npx tsx scripts/analyse.ts $ARGS 2>&1 | tee "$RUNNER_TEMP/analyse.log" || { echo "::error title=Analyse::$(grep -v '^✓' "$RUNNER_TEMP/analyse.log" | tail -c 1500 | tr '\n' ' ')"; exit 1; }
      # le journal d'une analyse ratée est publié sur la branche « journal » (sans secret : le jeton n'y est jamais écrit)
      - name: Publier le journal en cas d'échec
        if: failure()
        working-directory: ${{ runner.temp }}
        run: |
          mkdir journal && cp analyse.log journal/ 2>/dev/null || echo "pas de journal" > journal/analyse.log
          cd journal && git init -q -b journal && git config user.name "chess-drill" && git config user.email "analyse@users.noreply.github.com"
          git add -A && git commit -q -m "Journal du $(date -u +%Y-%m-%d\ %H:%M) UTC" && git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" journal
