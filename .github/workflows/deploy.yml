# Déploiement sur Cloudflare Workers à chaque push sur main qui touche app/ :
# tests + typecheck + build, migrations D1, puis wrangler deploy (avec le secret APP_TOKEN du Worker).
# Secrets du repo : CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, APP_TOKEN.
name: Déploiement
on:
  push:
    branches: [main, refonte]
    paths: ['app/**', '.github/workflows/deploy.yml']
  workflow_dispatch:
concurrency: { group: deploy, cancel-in-progress: false }
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - name: Dépendances
        working-directory: app
        run: npm ci
      - name: Tests, typecheck et build
        working-directory: app
        run: npm run build && npx tsc --noEmit -p worker
      - name: Base D1 (créée au premier passage, identifiant injecté dans wrangler.jsonc)
        working-directory: app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          id=$(npx wrangler d1 list --json | node -e 'const l=JSON.parse(require("fs").readFileSync(0,"utf8"));const d=l.find(x=>x.name==="chess-drill");process.stdout.write(d?d.uuid:"")')
          if [ -z "$id" ]; then
            npx wrangler d1 create chess-drill > /dev/null
            id=$(npx wrangler d1 list --json | node -e 'const l=JSON.parse(require("fs").readFileSync(0,"utf8"));process.stdout.write(l.find(x=>x.name==="chess-drill").uuid)')
            echo "Base D1 créée : $id"
          fi
          sed -i "s/00000000-0000-0000-0000-000000000000/$id/" wrangler.jsonc
          grep -q "$id" wrangler.jsonc
      - name: Migrations D1 et déploiement
        uses: cloudflare/wrangler-action@v3
        env:
          APP_TOKEN: ${{ secrets.APP_TOKEN }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: app
          secrets: |
            APP_TOKEN
          command: |
            d1 migrations apply chess-drill --remote
            deploy
