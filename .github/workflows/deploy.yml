# Déploiement sur Cloudflare Workers à chaque push sur main qui touche app/ : tests, migrations D1, déploiement.
# Secrets du repo : CLOUDFLARE_API_TOKEN (droits Workers Scripts + D1 en édition), CLOUDFLARE_ACCOUNT_ID.
name: Déploiement
on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/deploy.yml']
  workflow_dispatch:
concurrency: { group: deploy, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
      - run: npm run build
      - run: npx tsc --noEmit -p worker
      - run: npx wrangler d1 migrations apply chess-drill --remote
      - run: npx wrangler deploy
